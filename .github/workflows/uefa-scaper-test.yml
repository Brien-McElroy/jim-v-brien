# A test you run by hand. It does not touch the Premier League job, does not
# change any file in the repo, does not build a page and does not email anyone.
#
# Version 4: the input is now a drop-down menu instead of a box you type in,
# so there is nothing to spell and nothing left over from last time. Just
# pick from the list and press the green button.
name: UEFA scraper test

on:
  workflow_dispatch:
    inputs:
      what:
        description: "What to test"
        required: true
        type: choice
        default: "players - top scorers, and anything else UEFA will give us"
        options:
          - "players - top scorers, and anything else UEFA will give us"
          - "clubs - what UEFA holds about each club"
          - "3 - read Matchday 3, whose scores we already know"
          - "4 - read Matchday 4 for real"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The menu entries read as sentences, so take the first word of
      # whichever one was chosen and hand that to the script.
      - name: Try to read the results
        run: |
          CHOICE="${{ inputs.what }}"
          MODE="${CHOICE%% *}"
          echo "Running mode: $MODE"
          python UEFA_test_scraper.py "$MODE"
