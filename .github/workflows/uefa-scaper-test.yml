# A test you run by hand. It does not touch the Premier League job, does not
# change any file in the repo, does not build a page and does not email anyone.
# It only prints whether it managed to read the Champions League results.
name: UEFA scraper test

on:
  workflow_dispatch:
    inputs:
      matchday:
        description: "Which matchday to try (3 is the one with known answers)"
        required: false
        default: "3"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the browser
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Try to read the results
        run: python UEFA_test_scraper.py "${{ inputs.matchday || '3' }}"
