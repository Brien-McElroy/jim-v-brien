name: Weekly Premier League table

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install playwright==1.48.0
          playwright install --with-deps chromium
      - name: Fetch table
        run: python fetch_table.py
      - name: Save the dated table
        run: |
          git config user.name "table-bot"
          git config user.email "table-bot@users.noreply.github.com"
          git add tables/
          git diff --cached --quiet || git commit -m "Table for $(date -u +%F)"
          git push
      - name: Build Jim's page
        run: python build_site.py
      - name: Upload Jim's page
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Email the table
        if: hashFiles('email.txt') != ''
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python send_email.py email.txt "Premier League table - weekly"
      - name: Switch off after the final matchweek
        if: hashFiles('season_over.flag') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "Weekly Premier League table" --repo "$GITHUB_REPOSITORY"

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
