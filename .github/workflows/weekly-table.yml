# Runs once a day and does nothing most days.
#
# Premier League: unchanged from what has been working.
# Champions League: every UEFA step is skipped unless a file called
#   UEFA_live.flag exists in the repo. Create that file when Jim says yes;
#   until then this workflow behaves exactly as it did before.
#
# Both games publish to the same GitHub Pages site, which is why they share
# one job - two workflows deploying would overwrite each other.
#   Premier League  ->  site/index.html
#   Champions League -> site/uefa/index.html
name: Weekly Premier League table

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright==1.48.0
          playwright install --with-deps chromium

      # ---------------- Premier League ----------------
      - name: Fetch table
        run: python fetch_table.py

      # ---------------- Champions League ----------------
      # Reads UEFA's feed directly, no browser. Finishes quietly unless the
      # next unscored matchday is complete.
      - name: Fetch Champions League results
        if: hashFiles('UEFA_live.flag') != ''
        run: python UEFA_fetch_results.py

      - name: Build Jim's page
        run: python build_site.py

      - name: Build the Champions League page
        if: hashFiles('UEFA_live.flag') != ''
        run: python UEFA_build_site.py

      - name: Write the Premier League summary
        run: python make_summary.py

      # Everything that records what has been SENT is written by the steps
      # above, so the commit has to come after them. With it before, the
      # stamps were thrown away at the end of every run and both games
      # emailed again the next day.
      - name: Save the results and what has been emailed
        run: |
          git config user.name "table-bot"
          git config user.email "table-bot@users.noreply.github.com"
          git add tables/ PL_last_emailed.txt \
                  UEFA_state.json UEFA_scorers.json UEFA_last_emailed.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Results for $(date -u +%F)"
          git push

      - name: Upload Jim's page
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # ---------------- emails ----------------
      # ONE email per completed matchweek, to both players. The table is
      # inside it, so there is no separate paste-ready email any more.
      - name: Email the Premier League matchweek
        if: hashFiles('summary.txt') != ''
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_BOTH: ${{ secrets.MAIL_BOTH }}
        run: python send_summary.py summary.txt "Premier League - Jim v Brien, Matchweek update"

      - name: Email the Champions League summary
        if: hashFiles('UEFA_live.flag') != '' && hashFiles('UEFA_email.txt') != ''
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_BOTH: ${{ secrets.MAIL_BOTH }}
        run: python send_summary.py UEFA_email.txt "Champions League - Brien v Jim update"

      - name: Switch off after the final matchweek
        if: hashFiles('season_over.flag') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "Weekly Premier League table" --repo "$GITHUB_REPOSITORY"

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
