name: Weekly Premier League table

on:
  schedule:
    - cron: "0 14 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install playwright==1.48.0
          playwright install --with-deps chromium
      - name: Fetch table
        id: fetch
        run: python fetch_table.py
      - name: Save the dated table
        run: |
          git config user.name "table-bot"
          git config user.email "table-bot@users.noreply.github.com"
          git add tables/
          git diff --cached --quiet || git commit -m "Table for $(date -u +%F)"
          git push
      - name: Email the table
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python send_email.py email.txt "Premier League table - weekly"
