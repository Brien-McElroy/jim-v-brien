# Runs once a day and does nothing most days.
#
# Premier League: unchanged from what has been working.
# Champions League: every UEFA step is skipped unless a file called
#   UEFA_live.flag exists in the repo. Create that file when Jim says yes;
#   until then this workflow behaves exactly as it did before.
#
# Only the Premier League half needs a browser. If the browser will not
# install, that half is skipped for the day and everything else still runs.
#
# Both games publish to the same GitHub Pages site, which is why they share
# one job - two workflows deploying would overwrite each other.
#   Premier League  ->  site/index.html
#   Champions League -> site/uefa/index.html
name: Weekly Premier League table

on:
  schedule:
    # Four times a day, not once. GitHub runs scheduled jobs when it has room,
    # not when you ask: through November 2026 this fired between 50 minutes and
    # 9 hours late, and GitHub drops runs outright when it is busy. Once a day
    # meant a dropped run cost a whole day, and could have cost a picks
    # reminder. Running four times a day costs nothing on a public repo and is
    # safe to repeat - every step below is guarded. The table only saves when
    # all 20 clubs have played one more game than the last saved table; the
    # Champions League only acts on a completed, unscored matchday; and each of
    # the three emails has its own stamp file, so none of them can go twice.
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The browser is only needed to read the Premier League table.
      #
      # `--with-deps` used to be on the second line. It makes playwright run
      # apt first, and on 11 Nov 2026 GitHub's runner could not reach Ubuntu's
      # package servers, so the whole job died ten minutes in and neither game
      # ran. The only packages apt wanted were nine FONT packages - Chinese,
      # Japanese, Cyrillic, emoji - which this job has never needed; every
      # real library is already on the runner image. So it is gone.
      #
      # If the download itself hiccups, try once more before giving up.
      - name: Install browser
        id: browser
        continue-on-error: true
        run: |
          pip install playwright==1.48.0
          playwright install chromium || {
            echo "That did not take. Waiting 20 seconds and trying once more."
            sleep 20
            playwright install chromium
          }

      # ---------------- Premier League ----------------
      # Only this step needs the browser. If it could not be installed, skip
      # reading the table and carry on - the Champions League half reads
      # UEFA's feed directly and does not need a browser at all. Losing one
      # day of the table costs nothing; losing the whole job might.
      # `continue-on-error` added 19 Nov 2026. On 11 Nov the browser install
      # was made non-fatal, but THIS step was left able to kill the job - and
      # on 19 Nov it did: premierleague.com answered with a CloudFront
      # "403 Request blocked" on all three attempts, fetch_table.py exited 1,
      # and the whole job stopped. That took down the Champions League half,
      # which needs neither a browser nor premierleague.com, and the Matchday 5
      # picks reminder with it. Nothing below here depends on today's table:
      # build_site.py reads whatever is already in tables/. So a bad day for
      # the Premier League must cost the Premier League and nothing else.
      # No `if:` on this step any more. Since 19 Nov 2026 fetch_table.py reads
      # the table from ESPN as plain JSON and only falls back to the browser,
      # so it is worth running even when the browser did not install.
      - name: Fetch table
        id: table
        continue-on-error: true
        run: python fetch_table.py

      - name: Say why the table was skipped
        if: steps.table.outcome != 'success'
        run: |
          if [ "${{ steps.browser.outcome }}" != "success" ]; then
            echo "::warning::The browser would not install, so the Premier League table was not read today. Everything else still ran, including the Champions League. Nothing is lost - the next run reads the table again."
            echo "The browser would not install, so the table was not read today."
          else
            echo "::warning::premierleague.com would not hand over the table today (it has been answering with a 403 block to GitHub's servers). Everything else still ran, including the Champions League. Scroll up to the 'Fetch table' step to see what the site said."
            echo "premierleague.com would not hand over the table today."
            echo "Look at the 'Fetch table' step above for what the site said."
          fi
          echo "Everything below still runs, including the Champions League."
          echo "Jim's page keeps showing the last table that was read."

      # ---------------- Champions League ----------------
      # Reads UEFA's feed directly, no browser. Finishes quietly unless the
      # next unscored matchday is complete.
      - name: Fetch Champions League results
        if: hashFiles('UEFA_live.flag') != ''
        run: python UEFA_fetch_results.py

      - name: Build Jim's page
        run: python build_site.py

      - name: Build the Champions League page
        if: hashFiles('UEFA_live.flag') != ''
        run: python UEFA_build_site.py

      - name: Write the Premier League summary
        run: python make_summary.py

      # Everything that records what has been SENT is written by the steps
      # above, so the commit has to come after them. With it before, the
      # stamps were thrown away at the end of every run and both games
      # emailed again the next day.
      # One `git add` listing several files is ALL OR NOTHING: if any one of
      # them does not exist, git stages none of them and the whole commit is
      # silently skipped. UEFA_last_emailed.txt does not exist until the first
      # Champions League email goes out, so every run was quietly saving
      # nothing - which is why the same matchweek was emailed day after day.
      # Adding them one at a time means a missing file costs only itself.
      - name: Save the results and what has been emailed
        run: |
          git config user.name "table-bot"
          git config user.email "table-bot@users.noreply.github.com"
          for f in tables PL_last_emailed.txt UEFA_state.json \
                   UEFA_scorers.json UEFA_kickoffs.json \
                   UEFA_last_emailed.txt UEFA_last_reminded.txt; do
            git add "$f" 2>/dev/null || echo "  (no $f this run - that is fine)"
          done
          if git diff --cached --quiet; then
            echo "Nothing changed, nothing to commit."
          else
            echo "Committing:"
            git diff --cached --name-only | sed 's/^/  /'
            git commit -q -m "Results for $(date -u +%F)"
            git push
          fi

      - name: Upload Jim's page
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # ---------------- emails ----------------
      # ONE email per completed matchweek, to both players. The table is
      # inside it, so there is no separate paste-ready email any more.
      - name: Email the Premier League matchweek
        if: hashFiles('summary.txt') != ''
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_BOTH: ${{ secrets.MAIL_BOTH }}
        run: python send_summary.py summary.txt "Premier League - Jim v Brien, Matchweek update"

      # Three days before a matchday locks, one reminder to both players
      # with the cut-off in UTC and in Pacific time.
      - name: Email the picks reminder
        if: hashFiles('UEFA_live.flag') != '' && hashFiles('UEFA_reminder.txt') != ''
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_BOTH: ${{ secrets.MAIL_BOTH }}
        run: python send_summary.py UEFA_reminder.txt "Champions League - picks close in 3 days"

      - name: Email the Champions League summary
        if: hashFiles('UEFA_live.flag') != '' && hashFiles('UEFA_email.txt') != ''
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_BOTH: ${{ secrets.MAIL_BOTH }}
        run: python send_summary.py UEFA_email.txt "Champions League - Brien v Jim update"

      - name: Switch off after the final matchweek
        if: hashFiles('season_over.flag') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "Weekly Premier League table" --repo "$GITHUB_REPOSITORY"

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
