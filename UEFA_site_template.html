<style>
/* Deliberately dark and silver so it is never mistaken for the Premier League page. */
:root{
  --font-display:'Oswald','Arial Narrow',sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#070A12; --surface:#0E1424; --surface-2:#151D33; --surface-3:#1C2642;
  --fg:#E9EFFA; --muted:#93A3C4; --line:#223052; --line-strong:#33446F;
  --accent:#3DD6F5; --accent-ink:#04121A;
  --brien:#3DD6F5; --jim:#FFC24B;
  --good:#5BE49B; --bad:#FF7A8A; --gold:#FFD36E;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;margin:0;padding:18px 16px 64px;
  background-image:radial-gradient(1px 1px at 20% 12%,rgba(255,255,255,.35),transparent),radial-gradient(1px 1px at 68% 7%,rgba(255,255,255,.25),transparent),radial-gradient(1.4px 1.4px at 84% 22%,rgba(255,255,255,.3),transparent),radial-gradient(1px 1px at 36% 30%,rgba(255,255,255,.18),transparent),radial-gradient(1px 1px at 9% 44%,rgba(255,255,255,.14),transparent);
  background-repeat:no-repeat}
.wrap{max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
h2{font-size:23px;font-weight:600;text-transform:uppercase;letter-spacing:.1em}
h3{font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
#app{display:flex;flex-direction:column;gap:22px}
.tab-body{display:flex;flex-direction:column;gap:26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* masthead */
.mast{display:flex;align-items:center;gap:clamp(12px,3vw,20px)}
.ball{flex:none;width:clamp(46px,11vw,78px);height:auto}
.mast-k{margin:0 0 3px;font:600 clamp(10px,2.4vw,12px) var(--font-body);letter-spacing:.34em;text-transform:uppercase;color:var(--accent)}
h1.t{font-family:var(--font-display);font-size:clamp(32px,8.6vw,66px);line-height:.95;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
h1.t .v{color:var(--muted);font-weight:500}
.mast-s{margin:7px 0 0;font:600 clamp(11px,2.7vw,14px) var(--font-body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.rule{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--brien) 0 50%,var(--jim) 50% 100%);opacity:.9}
.mw{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mw b{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-strong);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{appearance:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:11px 13px;font:600 13px var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* scoreboard */
.board{border:1px solid var(--line-strong);border-radius:16px;padding:20px 14px 22px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:linear-gradient(180deg,var(--surface-2),var(--surface))}
.side{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;border-top:5px solid var(--c);padding-top:12px}
.side.brien{--c:var(--brien)} .side.jim{--c:var(--jim)}
.who{font-family:var(--font-display);font-weight:600;font-size:clamp(19px,5vw,27px);letter-spacing:.2em;text-transform:uppercase;color:var(--c)}
.num{font-family:var(--font-display);font-weight:700;font-size:clamp(62px,19vw,122px);line-height:.9;font-variant-numeric:tabular-nums}
.sub1{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.35}
.mid{font-family:var(--font-display);font-size:clamp(20px,6vw,30px);color:var(--muted);font-weight:500}
.verdict{margin:0;font-size:clamp(16px,4vw,19px);font-weight:700}
.pm{font-weight:800;font-variant-numeric:tabular-nums}
.pm.up{color:var(--good)} .pm.down{color:var(--bad)} .pm.even{color:var(--muted)}
.crown{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}

/* tables */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line)}
th{font:700 11px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.tm{text-align:left;font-weight:600}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
tr.q1 td:first-child{box-shadow:inset 3px 0 var(--good)}
tr.q2 td:first-child{box-shadow:inset 3px 0 var(--accent)}
tr.q3 td:first-child{box-shadow:inset 3px 0 var(--bad)}
.lead{font-family:var(--font-display);font-size:19px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.lead.brien{color:var(--brien)} .lead.jim{color:var(--jim)}

/* picks */
.mdblock{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.mdhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--surface-2);flex-wrap:wrap}
.mdhead b{font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted)}
.tag.open{color:var(--good);border-color:var(--good)}
.tag.locked{color:var(--muted)}
.tag.done{color:var(--accent);border-color:var(--accent)}
/* Each game sits in its own outlined box, with the compare button inside it. */
.mlist{display:grid;gap:10px;background:transparent;padding:0}
.m{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:1px;
  background:var(--line);border:1px solid var(--line-strong);border-radius:11px;overflow:hidden}
.pk{appearance:none;border:0;background:var(--surface);color:var(--fg);font:600 12px var(--font-body);padding:11px 10px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;min-width:0}
.pk:last-child{text-align:right;justify-content:flex-end}
.pk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk[data-on="1"]{background:var(--surface-3);box-shadow:inset 0 0 0 2px var(--c,var(--accent))}
.pk:disabled{cursor:default;opacity:.95}
.vs{background:var(--surface);color:var(--muted);font-size:11px;font-weight:700;display:flex;align-items:center;padding:0 8px;letter-spacing:.06em}
.res{background:var(--surface);color:var(--fg);font:700 13px var(--font-body);display:flex;align-items:center;padding:0 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.b{background:var(--brien)} .dot.j{background:var(--jim)}
.who2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden}
.seg button{appearance:none;background:none;border:0;color:var(--muted);font:700 12px var(--font-body);letter-spacing:.1em;text-transform:uppercase;padding:8px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c,var(--accent));color:#04121A}
.seg.brien button[aria-pressed="true"]{background:var(--brien)}
.seg.jim button[aria-pressed="true"]{background:var(--jim)}
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--fg);font:600 13px var(--font-body);padding:9px 15px;border-radius:9px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
textarea,input[type=text],input[type=number]{width:100%;background:var(--surface-2);color:var(--fg);border:1px solid var(--line-strong);border-radius:9px;padding:10px;font:500 14px var(--font-body)}
textarea{min-height:150px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.note{margin:0;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;background:var(--surface-2);font-size:13.5px}
.note.warn{border-left-color:var(--gold)}
ol.steps{margin:0;padding-left:22px;display:grid;gap:11px}
ol.steps li{padding-left:3px}
ul.plain{margin:6px 0 0;padding-left:20px;display:grid;gap:7px}

/* chart */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:500 11px var(--font-body)}
.chart .ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chart .ln.b{stroke:var(--brien)} .chart .ln.j{stroke:var(--jim)}
.chart .dt{fill:var(--bg);stroke-width:2.5}
.chart .dt.b{stroke:var(--brien)} .chart .dt.j{stroke:var(--jim)}
.chart .dt.last.b{fill:var(--brien)} .chart .dt.last.j{fill:var(--jim)}
.chart .en{font:700 12px var(--font-body)}
.chart .en.b{fill:var(--brien)} .chart .en.j{fill:var(--jim)}

/* bracket */
.bk{display:grid;gap:10px}
.tie{border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:10px 12px;display:grid;gap:7px}
.tie .lab{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.tie .sides{display:grid;gap:5px}
.pts{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:10px}
.ha{margin-left:auto;flex:none;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);opacity:.75}
.pk:last-child .ha{margin-left:auto}
@media (max-width:560px){.pk .ha{margin-left:auto}}
.picklist{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.picklist>div{background:var(--surface);padding:9px 11px;font-size:14.5px;font-weight:600;display:flex;gap:9px;align-items:baseline;min-width:0}
.picklist .n{color:var(--muted);font-size:12px;font-weight:700;min-width:17px;text-align:right;flex:none}
.picklist>div>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* both players' picks side by side */
.cmp{width:100%;border-collapse:collapse}
.cmp th{font:700 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:7px 5px;text-align:left}
.cmp td{padding:8px 5px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.cmp .fx{font-weight:600}
.cmp .who-b{color:var(--brien);font-weight:700}
.cmp .who-j{color:var(--jim);font-weight:700}
.cmp .hit::after{content:" \2713";color:var(--good)}
.cmp .res{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
@media (max-width:520px){.cmp td,.cmp th{padding:7px 3px;font-size:13px}}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;font-weight:700;letter-spacing:.06em;
  word-break:break-all;background:var(--bg);border:1px dashed var(--gold);border-radius:9px;padding:13px;
  text-align:center;color:var(--gold)}

@media (max-width:560px){
  .board{grid-template-columns:1fr;gap:16px}
  .mid{display:none}
  .m{grid-template-columns:1fr}
  .pk{padding:9px 11px}
  .pk:last-child{text-align:left;justify-content:flex-start}
  .vs{display:none}
  .res{padding:4px 11px;justify-content:flex-start;font-size:12px;color:var(--muted)}
  th,td{padding:7px 4px}
}
/* ---- compare button on each match row ---- */
/* The tint sits on the words themselves, not across the whole row. */
.cmpb{grid-column:1/-1;appearance:none;border:0;border-top:1px solid var(--line-strong);
  background:var(--surface);padding:8px 10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.cmpp{display:inline-flex;align-items:center;gap:7px;
  background:rgba(61,214,245,.14);border:1px solid rgba(61,214,245,.32);
  color:var(--accent);font:800 12px var(--font-body);letter-spacing:.12em;
  text-transform:uppercase;padding:5px 13px 5px 7px;border-radius:999px}
.cmpb:hover .cmpp{background:rgba(61,214,245,.26);border-color:var(--accent);color:#BFF2FF}
.cmpi{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
  border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px;
  font-weight:800;letter-spacing:0;flex:none}

/* ---- the comparison box ---- */
.ovl{position:fixed;inset:0;z-index:60;background:rgba(4,7,16,.74);
  display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;width:100%;max-width:540px;max-height:90vh;overflow:auto;
  background:var(--surface);border:1px solid var(--line-strong);border-bottom:0;
  border-radius:18px 18px 0 0;padding:12px 16px 20px;
  box-shadow:0 -14px 50px rgba(0,0,0,.55)}
@media (min-width:600px){
  .ovl{align-items:center;padding:20px}
  .sheet{border-bottom:1px solid var(--line-strong);border-radius:16px}
}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line-strong);margin:0 auto 9px}
.xb{position:absolute;top:9px;right:11px;appearance:none;background:var(--surface-2);
  border:1px solid var(--line-strong);color:var(--muted);width:29px;height:29px;
  border-radius:99px;font-size:13px;line-height:1;cursor:pointer}
.xb:hover{color:var(--fg)}
.cpr{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;margin:6px 0 14px}
.cpr .cl{text-align:center;min-width:0}
.cpr img{width:52px;height:52px;object-fit:contain;display:block;margin:0 auto 7px}
.cpr .cn{font:700 14.5px var(--font-body);line-height:1.25}
.cpr .mid2{color:var(--muted);font:600 13px var(--font-body);padding-top:24px}
.stats{border-top:1px solid var(--line)}
.srow{display:grid;grid-template-columns:1fr 104px 1fr;gap:6px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--line)}
.srow .lb{text-align:center;font:700 10px var(--font-body);letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted)}
.srow .va,.srow .vb{font:700 15px var(--font-body);font-variant-numeric:tabular-nums}
.srow .va{text-align:right} .srow .vb{text-align:left}
.frm{display:inline-flex;gap:3px} .frm.r{justify-content:flex-end}
.fc{width:19px;height:19px;border-radius:5px;font:800 10px var(--font-body);
  display:flex;align-items:center;justify-content:center;color:var(--bg);flex:none}
.fc.W{background:var(--good)} .fc.D{background:var(--muted)} .fc.L{background:var(--bad)}
.cbtns{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cb{appearance:none;border:1px solid var(--line-strong);background:var(--surface-2);
  color:var(--fg);border-radius:12px;padding:13px 9px;cursor:pointer;
  font:700 13.5px var(--font-body);display:flex;flex-direction:column;
  align-items:center;gap:7px;min-width:0}
.cb img{width:34px;height:34px;object-fit:contain;pointer-events:none}
.cb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;pointer-events:none}
.cb[data-on="1"]{background:var(--surface-3);box-shadow:inset 0 0 0 2px var(--c,var(--accent))}
</style>

/* ---------------------------------------------------------------
   Brien v Jim - UEFA Champions League 2026/27 predictor
   Scoring: pick a winner for every match from Matchday 4 on.
     right winner  +2
     match drawn   +1 (both players, as long as a pick was made)
     wrong         0
   Tie-break: add up the final league-phase goal difference of every
   team you picked. Higher total wins.
   The game ends after Matchday 8 and the higher score is crowned.
   The bracket is an optional extra afterwards, scored on its own.
----------------------------------------------------------------*/
var NICE={"Fenerbahce":"Fenerbahçe","Bayern Munchen":"Bayern München","Bodo/Glimt":"Bodø/Glimt"};
function nm(t){return NICE[t]||t}

/* UEFA's own club numbers, read straight from their club feed on 24 Oct 2026.
   They give us the crest image and the address of UEFA's comparison page.
   Nothing here is typed from memory. */
var CLUBID={

function crest(t){var id=CLUBID[t];return id?("https://img.uefa.com/imgml/TP/teams/logos/240x240/"+id+".png"):""}
function cmpLink(a,b){
  var x=CLUBID[a],y=CLUBID[b];
  return (x&&y)?("https://www.uefa.com/uefachampionsleague/clubs/comparison/"+x+"/"+y+"/"):"";
}
var MDS=[4,5,6,7,8], ALLMD=[1,2,3,4,5,6,7,8];
var ROUNDS=[{k:"PO",n:"KO play-offs",c:8,p:2},{k:"R16",n:"Round of 16",c:8,p:4},
            {k:"QF",n:"Quarter-finals",c:4,p:8},{k:"SF",n:"Semi-finals",c:2,p:16},
            {k:"F",n:"Final",c:1,p:32}];
var STATIC=!!window.STATIC_MODE;
var S={picks:{brien:{},jim:{}},results:{},bracket:{setup:{},picks:{brien:{},jim:{}},winners:{}}};
if(STATIC&&window.STATIC_DATA)S=window.STATIC_DATA;
var DB=null, who="brien", tab="results", upMd=4, codeFlash=null;
var TODAY=(window.STATIC_DATE?new Date(window.STATIC_DATE+"T12:00:00Z"):new Date());

/* ---------- fixtures ---------- */
function fixtures(md){
  var raw=(md<=3?FX.played[md]:FX.future[md])||[];
  return raw.map(function(r,i){return {i:i,date:r[0],h:r[1],a:r[2]}});
}
function mdDates(md){var f=fixtures(md),s={};f.forEach(function(m){s[m.date]=1});return Object.keys(s).sort()}
function mdOpens(md){return mdDates(md)[0]}
function fmtDate(iso){
  var p=iso.split("-"),mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return (+p[2])+" "+mo[+p[1]-1]+" "+p[0];
}
function mdDateLabel(md){var d=mdDates(md);return d.length>1?fmtDate(d[0])+" – "+fmtDate(d[d.length-1]):fmtDate(d[0])}

/* ---------- results ---------- */
function resultsFor(md){
  if(md<=3)return FX.played[md].map(function(r){return [r[3],r[4]]});
  var r=S.results["md"+md];
  return (r&&r.s&&r.s.length===18)?r.s:null;
}
function hasResults(md){return !!resultsFor(md)}
function isOpen(md){ // picks still being accepted
  if(hasResults(md))return false;
  return TODAY<new Date(mdOpens(md)+"T00:00:00Z");
}
function lastDone(){var l=0;ALLMD.forEach(function(m){if(hasResults(m))l=m});return l}
function nextOpen(){var n=0;MDS.forEach(function(m){if(!n&&isOpen(m))n=m});return n}
function daysTo(iso){
  var a=new Date(iso+"T00:00:00Z"),b=new Date(TODAY.toISOString().slice(0,10)+"T00:00:00Z");
  return Math.round((a-b)/86400000);
}
function deadlineNote(){
  var n=nextOpen(); if(!n)return null;
  var d=mdOpens(n),left=daysTo(d);
  return {md:n,date:fmt2(d),left:left,
          urgent:left<=3,
          text:"Picks for Matchday "+n+" close "+(left===0?"TODAY":left===1?"TOMORROW":("in "+left+" days"))+
               " · "+fmt2(d)};
}
function fmt2(iso){
  var p=iso.split("-"),dw=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var dt=new Date(iso+"T12:00:00Z");
  return dw[dt.getUTCDay()]+" "+fmtDate(iso);
}

/* ---------- table ---------- */
function standings(upto){
  var t={};
  ALLMD.forEach(function(md){
    if(md>upto)return; var rs=resultsFor(md); if(!rs)return;
    fixtures(md).forEach(function(m,i){
      var hg=rs[i][0],ag=rs[i][1];
      [m.h,m.a].forEach(function(x){if(!t[x])t[x]={t:x,P:0,W:0,D:0,L:0,GF:0,GA:0}});
      var H=t[m.h],A=t[m.a];
      H.P++;A.P++;H.GF+=hg;H.GA+=ag;A.GF+=ag;A.GA+=hg;
      if(hg>ag){H.W++;A.L++}else if(ag>hg){A.W++;H.L++}else{H.D++;A.D++}
    });
  });
  var rows=Object.keys(t).map(function(k){var r=t[k];r.GD=r.GF-r.GA;r.Pts=r.W*3+r.D;return r});
  rows.sort(function(a,b){return b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF||(a.t<b.t?-1:1)});
  rows.forEach(function(r,i){r.pos=i+1});
  return rows;
}
function gdMap(){var m={};standings(8).forEach(function(r){m[r.t]=r.GD});return m}

/* ---------- one club's record, for the comparison box ----------
   Every number below is worked out from the scores we have already read
   from UEFA, so it moves on its own as each matchday is scored. */
function teamRow(t){var r=null;standings(8).forEach(function(x){if(x.t===t)r=x});return r}
function teamForm(t,n){
  var out=[];
  ALLMD.forEach(function(md){
    var rs=resultsFor(md); if(!rs)return;
    fixtures(md).forEach(function(m,i){
      if(m.h!==t&&m.a!==t)return;
      var home=(m.h===t),gf=home?rs[i][0]:rs[i][1],ga=home?rs[i][1]:rs[i][0];
      out.push({md:md,opp:home?m.a:m.h,home:home,gf:gf,ga:ga,
                r:(gf>ga?"W":gf<ga?"L":"D")});
    });
  });
  return n?out.slice(-n):out;
}
/* In the league phase each club meets eight different clubs, so any two
   of them meet at most once across the whole of Matchdays 1-8. */
function h2h(a,b){
  var out=null;
  ALLMD.forEach(function(md){
    fixtures(md).forEach(function(m,i){
      if((m.h===a&&m.a===b)||(m.h===b&&m.a===a)){
        var rs=resultsFor(md);
        out={md:md,h:m.h,a:m.a,s:rs?rs[i]:null};
      }
    });
  });
  return out;
}

/* ---------- picks + scoring ---------- */
function pickOf(p,md,i){var a=S.picks[p]&&S.picks[p][md];return a?(a[i]||null):null}
function setPick(p,md,i,v){
  if(!S.picks[p])S.picks[p]={};
  if(!S.picks[p][md])S.picks[p][md]=new Array(18).fill(null);
  S.picks[p][md][i]=v;
}
/* Jim's picks page hands him a code like MD4-HAHHAAHAHHAAHHAHA-7.
   The last character is a check digit, so a mistyped or clipped code is
   rejected rather than quietly scoring the wrong picks. */
function checkChar(s){var n=0;for(var i=0;i<s.length;i++)n=(n*31+s.charCodeAt(i))%36;
  return "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ".charAt(n)}
function makeCode(p,md,arr){
  var w=(p==="jim"?"J":"B"),body=arr.join("");
  return "MD"+md+"-"+w+"-"+body+"-"+checkChar("MD"+md+w+body);
}
function readCode(raw){
  var s=String(raw||"").toUpperCase().replace(/\s+/g,"");
  var m=s.match(/MD([4-8])-([JB])-([HA]{18})-([0-9A-Z])/);
  if(m){
    if(checkChar("MD"+m[1]+m[2]+m[3])!==m[4])
      return {err:"That message is damaged — something was changed or lost in sending. Ask for it again."};
    return {md:+m[1],who:(m[2]==="J"?"jim":"brien"),arr:m[3].split("")};
  }
  // the first version of the picks page left the name out; those were Jim's
  m=s.match(/MD([4-8])-([HA]{18})-([0-9A-Z])/);
  if(m){
    if(checkChar("MD"+m[1]+m[2])!==m[3])
      return {err:"That message is damaged — something was changed or lost in sending. Ask for it again."};
    return {md:+m[1],who:"jim",arr:m[2].split("")};
  }
  return {err:"Could not find any picks in that. Paste the whole message, including the last line that starts with \u2018ref:\u2019."};
}
function scoreMd(p,md){
  var rs=resultsFor(md); if(!rs||md<4)return null;
  var f=fixtures(md),pts=0,hit=0,miss=0,drew=0,made=0;
  f.forEach(function(m,i){
    var pk=pickOf(p,md,i); if(!pk)return; made++;
    var hg=rs[i][0],ag=rs[i][1];
    if(hg===ag){pts+=1;drew++}
    else if((hg>ag&&pk==="H")||(ag>hg&&pk==="A")){pts+=2;hit++}
    else miss++;
  });
  return {pts:pts,hit:hit,miss:miss,drew:drew,made:made};
}
function leagueTotal(p){
  var t=0,hit=0,drew=0,miss=0;
  MDS.forEach(function(md){var s=scoreMd(p,md);if(s){t+=s.pts;hit+=s.hit;drew+=s.drew;miss+=s.miss}});
  return {pts:t,hit:hit,drew:drew,miss:miss};
}
function tieBreak(p){ // sum of final GD of every team picked
  var g=gdMap(),sum=0,n=0;
  MDS.forEach(function(md){
    fixtures(md).forEach(function(m,i){
      var pk=pickOf(p,md,i); if(!pk)return;
      var t=pk==="H"?m.h:m.a; if(g[t]!==undefined){sum+=g[t];n++}
    });
  });
  return {sum:sum,n:n};
}
function bracketTotal(p){
  var t=0,hit=0,done=0;
  ROUNDS.forEach(function(R){
    var w=S.bracket.winners[R.k]||[],pk=(S.bracket.picks[p]||{})[R.k]||[];
    for(var i=0;i<R.c;i++){
      if(w[i]===undefined||w[i]===null)continue; done++;
      if(pk[i]===w[i]){t+=R.p;hit++}
    }
  });
  return {pts:t,hit:hit,done:done};
}
function grandTotal(p){return leagueTotal(p).pts}
function seasonDone(){return hasResults(8)}

function leaderInfo(){
  var b=grandTotal("brien"),j=grandTotal("jim");
  if(b!==j)return{who:b>j?"brien":"jim",by:Math.abs(b-j),tie:false,b:b,j:j};
  var tb=tieBreak("brien").sum,tj=tieBreak("jim").sum;
  if(tb!==tj)return{who:tb>tj?"brien":"jim",by:0,tie:true,b:b,j:j,gd:Math.abs(tb-tj)};
  return{who:null,by:0,tie:true,b:b,j:j};
}

/* ---------- small helpers ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function cap(p){return p==="brien"?"Brien":"Jim"}
function sgn(n){return (n>0?"+":"")+n}

/* ---------- views ---------- */
function resultsView(){
  var L=leaderInfo(),done=lastDone(),h="";
  var bl=leagueTotal("brien"),jl=leagueTotal("jim"),bb=bracketTotal("brien"),jb=bracketTotal("jim");
  var started=done>=4;
  h+='<div class="board">';
  h+=sideHtml("brien",L,bl,bb);
  h+='<div class="mid">v</div>';
  h+=sideHtml("jim",L,jl,jb);
  h+='</div>';
  var dn=deadlineNote();
  if(dn){
    h+='<section class="card" style="border-color:'+(dn.urgent?'var(--gold)':'var(--line-strong)')+'">'+
       '<div class="row" style="justify-content:space-between;gap:12px">'+
       '<div><div class="lead" style="color:'+(dn.urgent?'var(--gold)':'var(--fg)')+'">'+esc(dn.text.split(" \u00b7 ")[0])+'</div>'+
       '<div class="muted small">'+esc(dn.date)+'</div></div>'+
       (STATIC?'<button class="btn go" data-tab="makepicks">Make my picks</button>':'')+
       '</div></section>';
  }
  if(!started){
    h+='<p class="note">No betting matchdays have been scored yet. Matchday 4 on '+esc(mdDateLabel(4))+' is the first one that counts.</p>';
  }else{
    var v;
    if(seasonDone()){
      h+='<section class="card" style="border-color:var(--gold);text-align:center">'+
         '<div style="font-size:44px;line-height:1">♛</div>'+
         '<h2 style="margin:6px 0 4px;color:var(--gold)">'+esc(L.who?(cap(L.who)+" takes the crown"):"A shared crown")+'</h2>'+
         '<p class="muted small" style="margin:0">'+
           esc(L.who?(cap(L.who)+" is the 2026/27 Champions League Predictor."+(L.tie?" Level on points, settled on goal difference.":"")) 
                    :"All eight matchdays done and dead level.")+'</p>'+
         '<p class="muted small" style="margin:10px 0 0">Played for fun. Want to carry on? The knockout bracket is on the Bracket tab, scored on its own.</p></section>';
    }else{
      if(L.who===null)v="Dead level.";
      else if(L.tie)v=cap(L.who)+" leads on goal difference.";
      else v=cap(L.who)+" leads by "+L.by+" point"+(L.by===1?"":"s")+".";
      h+='<p class="verdict">'+esc(v)+'</p>';
      h+='<p class="muted small" style="margin:-10px 0 0">Scored through Matchday '+done+'. Next: Matchday '+(done+1)+', '+esc(mdDateLabel(done+1))+'.</p>';
    }
  }
  if(started){
    h+='<section class="card"><h2 style="margin-bottom:12px">Matchday by matchday</h2><div class="scroll">'+mdTable()+'</div></section>';
    h+='<section class="card"><h2 style="margin-bottom:6px">Running total</h2><p class="muted small" style="margin:0 0 10px">Points after each matchday.</p>'+chartHtml()+'</section>';
  }
  return h;
}
function sideHtml(p,L,lg,bk){
  var tot=lg.pts,other=p==="brien"?grandTotal("jim"):grandTotal("brien");
  var d=tot-other,cls=d>0?"up":d<0?"down":"even";
  var h='<div class="side '+p+'">';
  if(L.who===p&&seasonDone())h+='<span class="crown">♛ Champion</span>';
  else if(L.who===p&&lastDone()>=4)h+='<span class="crown">★ Leading</span>';
  else h+='<span class="crown" style="color:transparent">★</span>';
  h+='<div class="who">'+cap(p)+'</div>';
  h+='<div class="num">'+tot+'</div>';
  var foe=p==="brien"?"Jim":"Brien";
  var line=lastDone()<4?"not started":(d===0?("level with "+foe):('<span class="pm '+cls+'">'+sgn(d)+'</span> on '+foe));
  h+='<div class="sub1">'+lg.hit+' winners called · '+lg.drew+' draws'+
     (bk.done?('<br>bracket '+bk.pts+' (separate)'):'')+
     '<br>'+line+'</div>';
  h+='</div>';
  return h;
}

function chartHtml(){
  var pts=[],cb=0,cj=0;
  MDS.forEach(function(md){var b=scoreMd("brien",md),j=scoreMd("jim",md);if(!b||!j)return;cb+=b.pts;cj+=j.pts;pts.push({md:md,b:cb,j:cj})});
  if(pts.length<1)return"";
  var W=720,H=250,L=40,R=52,T=18,B=34, max=Math.max(10,cb,cj);
  var x=function(i){return L+(pts.length<2?(W-L-R)/2:i*(W-L-R)/(pts.length-1))};
  var y=function(v){return T+(H-T-B)*(1-v/max)};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Running points">';
  for(var g=0;g<=4;g++){var v=Math.round(max*g/4),yy=y(v);
    s+='<line class="gl" x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'"/><text class="ax" x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end">'+v+'</text>';}
  pts.forEach(function(p,i){s+='<text class="ax" x="'+x(i)+'" y="'+(H-12)+'" text-anchor="middle">MD '+p.md+'</text>'});
  ["b","j"].forEach(function(k){
    var d=pts.map(function(p,i){return (i?"L":"M")+x(i)+" "+y(p[k])}).join(" ");
    s+='<path class="ln '+k+'" d="'+d+'"/>';
    pts.forEach(function(p,i){s+='<circle class="dt '+k+(i===pts.length-1?' last':'')+'" cx="'+x(i)+'" cy="'+y(p[k])+'" r="4.5"/>'});
    var last=pts[pts.length-1];
    s+='<text class="en '+k+'" x="'+(W-R+9)+'" y="'+(y(last[k])+4)+'">'+last[k]+'</text>';
  });
  s+='</svg><p class="muted small" style="margin:8px 0 0"><span style="color:var(--brien)">●</span> Brien &nbsp; <span style="color:var(--jim)">●</span> Jim</p>';
  return s;
}

  h+='<div class="scroll"><table class="cmp"><thead><tr><th>Match</th><th>Brien</th><th>Jim</th>'+(rs?'<th>Result</th>':'')+'</tr></thead><tbody>';
  f.forEach(function(m,i){
    var hw=rs?(rs[i][0]>rs[i][1]):null, aw=rs?(rs[i][1]>rs[i][0]):null, drew=rs?(rs[i][0]===rs[i][1]):false;
    function cell(pk,cls){
      if(!pk)return '<td class="muted">\u2014</td>';
      var t=(pk==="H"?m.h:m.a), right=rs&&!drew&&((pk==="H"&&hw)||(pk==="A"&&aw));
      return '<td class="'+cls+(right?" hit":"")+'">'+esc(nm(t))+'</td>';
    }
    h+='<tr><td class="fx">'+esc(nm(m.h))+' <span class="muted">v</span> '+esc(nm(m.a))+'</td>'+
       cell(bp[i],"who-b")+cell(jp[i],"who-j")+
       (rs?('<td class="res"><b>'+rs[i][0]+'\u2013'+rs[i][1]+'</b>'+(drew?'<br><span class="muted" style="font-size:11px">drawn</span>':'')+'</td>'):'')+'</tr>';
  });
  h+='</tbody></table></div>';
  if(rs){
    var b=scoreMd("brien",cmpMd),j=scoreMd("jim",cmpMd);
    if(b&&j)h+='<p class="muted small" style="margin:10px 0 0">Matchday '+cmpMd+': '+
      '<span class="who-b">Brien '+b.pts+'</span> \u00b7 <span class="who-j">Jim '+j.pts+'</span>'+
      ' \u2014 a tick marks a winner called right.</p>';
  }
  return h;
}

function rulesView(){
  var h='<section class="card"><h2 style="margin-bottom:12px">How to play</h2><ol class="steps">';
  h+='<li>Brien and Jim each pick a winner for every match from <b>Matchday 4</b> onwards — 90 matches in all. Matchdays 1 to 3 were already played before the bet started, so they do not count.</li>';
  h+='<li>There is no draw button. You back one team or the other in every match.</li>';
  h+='<li><b>How a match scores.</b><ul class="plain">'+
     '<li><b>+2</b> if the team you picked wins.</li>'+
     '<li><b>+1</b> if the match is a draw. Nobody called it, so you both get a point.</li>'+
     '<li><b>0</b> if the team you picked loses.</li></ul>'+
     'The most anyone can take from one matchday is 36 (all 18 right), and from the whole league phase 180.</li>';
  h+='<li>A matchday locks the day its first game kicks off. After the games, Brien enters the 18 scores and everything re-scores itself.</li>';
  h+='<li><b>Tie-break.</b> If the points finish level, add up the final goal difference of every team you picked across all 90 matches. The higher total wins. That is why the GD column on the Table tab matters.</li>';
  h+='<li><b>The game ends after Matchday 8</b>, on 27 January 2027. Highest score is crowned <b>Champions League Predictor</b>. If the points are level the goal-difference tie-break settles it; level on that too and the crown is shared.</li>';
  h+='<li>This one is <b>just for fun</b> — no bottle of red riding on it.</li>';
  h+='<li><b>Carrying on is optional.</b> If we both fancy it, the knockout bracket on the Bracket tab runs from February to the final on 4/5 June 2027: play-off <b>2</b>, Round of 16 <b>4</b>, quarter-final <b>8</b>, semi-final <b>16</b>, the final <b>32</b>. It is scored on its own and has nothing to do with the crown.</li>';
  h+='</ol></section>';
  h+='<section class="card"><h2 style="margin-bottom:10px">A worked example</h2>'+
     '<p style="margin:0 0 10px">Matchday 4, the match <b>Atleti v Bayern München</b>:</p><ul class="plain">'+
     '<li>Brien picks Atleti, Jim picks Bayern.</li>'+
     '<li>Bayern win 2–0. Jim takes <b>2</b>, Brien takes <b>0</b>.</li>'+
     '<li>Had it finished 1–1, they would take <b>1</b> each.</li></ul>'+
     '<p style="margin:12px 0 0">Do that 18 times for a matchday and 90 times for the league phase, and the running total is what you see on the Results tab.</p></section>';
  h+='<section class="card"><h2 style="margin-bottom:10px">The season</h2><div class="scroll"><table><thead><tr><th>Round</th><th>When</th><th>Counts towards the crown?</th></tr></thead><tbody>';
  [[1,"8–10 Sep 2026","no"],[2,"13–14 Oct 2026","no"],[3,"20–21 Oct 2026","no"]].forEach(function(r){
    h+='<tr><td class="tm">Matchday '+r[0]+'</td><td class="tm">'+r[1]+'</td><td class="muted">'+r[2]+'</td></tr>'});
  MDS.forEach(function(md){h+='<tr><td class="tm">Matchday '+md+'</td><td class="tm">'+esc(mdDateLabel(md))+'</td><td><b>yes</b></td></tr>'});
  h+='<tr><td class="tm" colspan="3" style="color:var(--gold);font-weight:700">♛ Champion crowned after Matchday 8</td></tr>';
  [["KO play-offs","15–24 Feb 2027","2 each"],["Round of 16","8–17 Mar 2027","4 each"],
   ["Quarter-finals","5–14 Apr 2027","8 each"],["Semi-finals","26 Apr – 5 May 2027","16 each"],
   ["Final","4/5 Jun 2027","32"]].forEach(function(r){
    h+='<tr><td class="tm">'+r[0]+'</td><td class="tm">'+r[1]+'</td><td class="muted">optional, '+r[2]+'</td></tr>'});
  h+='</tbody></table></div></section>';
  return h;
}

/* ---------- shell ---------- */
/* ---------- the comparison box ----------
   Opens over the pick list. The two pick buttons live inside it, so reading
   the comparison and making the pick are the same action and the box closes
   itself. It also shuts on the X, on a tap outside, on Esc, and on a
   downward swipe. Everything in it is computed from results already read
   from UEFA, so it keeps pace with the matchdays on its own. */
var cmpOpen=null, cmpScroll=0;
function fcHtml(f,right){
  if(!f.length)return '<span class="muted small">no matches yet</span>';
  var s=f.map(function(x){
    return '<span class="fc '+x.r+'" title="MD'+x.md+' '+(x.home?"v ":"at ")+nm(x.opp)+" "+x.gf+"-"+x.ga+'">'+x.r+'</span>';
  }).join("");
  return '<span class="frm'+(right?" r":"")+'">'+s+'</span>';
}
function srow(lab,a,b){
  return '<div class="srow"><div class="va">'+a+'</div><div class="lb">'+lab+'</div><div class="vb">'+b+'</div></div>';
}
function compareHtml(){
  if(!cmpOpen)return '';
  var md=cmpOpen.md,i=cmpOpen.i,mode=cmpOpen.mode;
  var f=fixtures(md)[i]; if(!f)return '';
  var H=f.h,A=f.a,rh=teamRow(H),ra=teamRow(A);
  var pick=(mode==="my")?(myArr(md)[i]||null):pickOf(who,md,i);
  var col=(mode==="my")?(MY||"brien"):who;
  var h='<div class="ovl" id="ovl"><section class="sheet" id="sheet">';
  h+='<div class="grab"></div><button class="xb" id="cmpx" aria-label="Close">✕</button>';
  h+='<p class="muted small" style="margin:0 0 2px;text-align:center">Matchday '+md+' · match '+(i+1)+' of 18</p>';
  h+='<div class="cpr">'+
     '<div class="cl"><img src="'+crest(H)+'" alt="" onerror="this.style.visibility=\'hidden\'"><div class="cn">'+esc(nm(H))+'</div><div class="muted small">home</div></div>'+
     '<div class="mid2">v</div>'+
     '<div class="cl"><img src="'+crest(A)+'" alt="" onerror="this.style.visibility=\'hidden\'"><div class="cn">'+esc(nm(A))+'</div><div class="muted small">away</div></div>'+
     '</div>';

  if(rh&&ra){
    h+='<div class="stats">';
    h+=srow("Position",rh.pos,ra.pos);
    h+=srow("Points",rh.Pts,ra.Pts);
    h+=srow("Played",rh.P,ra.P);
    h+=srow("W · D · L",rh.W+" · "+rh.D+" · "+rh.L,ra.W+" · "+ra.D+" · "+ra.L);
    h+=srow("Scored · let in",rh.GF+"–"+rh.GA,ra.GF+"–"+ra.GA);
    h+=srow("Goal diff",sgn(rh.GD),sgn(ra.GD));
    h+='<div class="srow"><div class="va">'+fcHtml(teamForm(H,5),true)+'</div>'+
       '<div class="lb">Form</div><div class="vb">'+fcHtml(teamForm(A,5),false)+'</div></div>';
    h+='</div>';
    h+='<p class="muted small" style="margin:9px 0 0">Form is oldest on the left. Hold a square to see that match.</p>';
  }else{
    h+='<p class="note">No results in yet, so there is nothing to compare on. The numbers fill in as the matchdays are scored.</p>';
  }

  var hh=h2h(H,A);
  if(hh&&hh.s){
    var w=hh.s[0]>hh.s[1]?hh.h:hh.s[1]>hh.s[0]?hh.a:null;
    h+='<p class="note" style="margin-top:10px"><b>They have already met.</b> Matchday '+hh.md+': '+
       esc(nm(hh.h))+' '+hh.s[0]+'–'+hh.s[1]+' '+esc(nm(hh.a))+
       (w?(' — '+esc(nm(w))+' won.'):' — a draw.')+'</p>';
  }else{
    h+='<p class="note" style="margin-top:10px">This is their only league-phase meeting — each club plays eight different opponents across the eight matchdays.</p>';
  }

  var lk=cmpLink(H,A);
  if(lk)h+='<p style="margin:10px 0 0"><a class="btn" style="text-decoration:none;display:inline-block" href="'+lk+'" target="_blank" rel="noopener">Full comparison on UEFA.com ↗</a></p>';

  h+='<h3 style="margin:16px 0 8px;text-align:center">Who wins?</h3>';
  var da=(mode==="my")?('data-my="'+i+'"'):('data-md="'+md+'" data-i="'+i+'"');
  h+='<div class="cbtns">'+
     '<button class="cb" '+da+' data-v="H" data-on="'+(pick==="H"?1:0)+'" style="--c:var(--'+col+')">'+
       '<img src="'+crest(H)+'" alt="" onerror="this.style.visibility=\'hidden\'"><span>'+esc(nm(H))+'</span></button>'+
     '<button class="cb" '+da+' data-v="A" data-on="'+(pick==="A"?1:0)+'" style="--c:var(--'+col+')">'+
       '<img src="'+crest(A)+'" alt="" onerror="this.style.visibility=\'hidden\'"><span>'+esc(nm(A))+'</span></button>'+
     '</div>';
  h+='<p class="muted small" style="margin:10px 0 0;text-align:center">Picking closes this box and takes you back to the list.</p>';
  h+='</section></div>';
  return h;
}

var TABS=STATIC
 ?[["results","Results"],["makepicks","Make picks"],["both","Both picks"],["table","Table"],["rules","Rules"],["bracket","Bracket · optional"]]
 :[["results","Results"],["picks","Picks"],["readmsg","Read a message"],["table","Table"],["update","Update"],["rules","Rules"],["bracket","Bracket · optional"]];

function render(){
  var tb=document.getElementById("tabs");
  tb.innerHTML=TABS.map(function(t){return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'</button>'}).join("");
  var done=lastDone(),nx=0;MDS.forEach(function(m){if(!nx&&!hasResults(m))nx=m});
  document.getElementById("mwlabel").textContent=done>=4?("Matchday "+done):"Matchday 4 next";
  document.getElementById("mwdate").textContent=done>=4
    ? ("scored · "+(nx?("Matchday "+nx+" on "+mdDateLabel(nx)):"that is the lot — champion crowned"))
    : ("picks close "+fmtDate(mdOpens(4)));
  document.getElementById("mastsub").textContent=(seasonDone()?"Matchdays 4-8 · complete":"Matchdays 4-8 · for fun")+(STATIC?" · read only":"");
  var v={results:resultsView,picks:picksView,makepicks:makePicksView,both:bothPicksView,
         readmsg:readMsgView,table:tableView,bracket:bracketView,update:updateView,
         rules:rulesView}[tab];
  document.getElementById("app").className="tab-body";
  /* Keep the page where it was. The pick list is long, and losing your
     place on every tap is the quickest way to make 18 picks a chore. */
  var sy=window.pageYOffset||document.documentElement.scrollTop||0;
  if(cmpOpen)cmpScroll=cmpScroll||sy;
  document.getElementById("app").innerHTML=(v?v():"")+compareHtml();
  document.body.style.overflow=cmpOpen?"hidden":"";
  if(!cmpOpen){var back=cmpScroll||sy;cmpScroll=0;if(back)window.scrollTo(0,back)}
}
/* The box shuts on Esc, and on a swipe down from inside it. */
document.addEventListener("keydown",function(e){
  if(cmpOpen&&(e.key==="Escape"||e.key==="Esc")){cmpOpen=null;render()}
});
var tStart=null;
document.addEventListener("touchstart",function(e){
  if(cmpOpen&&e.touches&&e.touches.length===1)tStart=e.touches[0].clientY;
},{passive:true});
document.addEventListener("touchend",function(e){
  if(!cmpOpen||tStart===null)return;
  var sh=document.getElementById("sheet");
  var y=(e.changedTouches&&e.changedTouches[0])?e.changedTouches[0].clientY:null;
  if(y!==null&&y-tStart>70&&(!sh||sh.scrollTop<=0)){cmpOpen=null;render()}
  tStart=null;
},{passive:true});

/* ---------- persistence ---------- */
function savePicks(p){
  if(!DB)return;
  DB.collection("picks").doc(p).set({md:S.picks[p]||{}}).catch(function(){});
}
function saveResults(md){
  if(!DB)return Promise.resolve();
  return DB.collection("results").doc("md"+md).set(S.results["md"+md]||{s:[]});
}
function saveBracket(){
  if(!DB)return Promise.resolve();
  return DB.collection("bracket").doc("state").set(S.bracket);
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  /* A tap on the dark area outside the box closes it. */
  if(cmpOpen&&e.target&&e.target.id==="ovl"){cmpOpen=null;render();return}
  var t=e.target.closest("button"); if(!t)return;
  if(t.dataset.cmp2){
    var p=t.dataset.cmp2.split("-");
    cmpScroll=window.pageYOffset||document.documentElement.scrollTop||0;
    cmpOpen={md:+p[0],i:+p[1],mode:p[2]};
    render();return;
  }
  if(t.id==="cmpx"){cmpOpen=null;render();return}
  /* Picking from inside the box: let the usual handler below record it,
     but close the box first so the pick lands you back on the list. */
  if(cmpOpen&&/\bcb\b/.test(t.className||""))cmpOpen=null;
  if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  if(t.dataset.who){who=t.dataset.who;render();return}
  if(t.dataset.up){upMd=+t.dataset.up;render();return}
  if(t.dataset.v&&t.dataset.md){
    var md=+t.dataset.md,i=+t.dataset.i;
    if(!isOpen(md))return;
    setPick(who,md,i,pickOf(who,md,i)===t.dataset.v?null:t.dataset.v);
    savePicks(who);render();return;
  }
  if(t.dataset.bk){
    var k=t.dataset.bk,ix=+t.dataset.i,sd=+t.dataset.s;
    if(!S.bracket.picks[who])S.bracket.picks[who]={};
    if(!S.bracket.picks[who][k])S.bracket.picks[who][k]=[];
    var cur=S.bracket.picks[who][k][ix];
    S.bracket.picks[who][k][ix]=(cur===sd?null:sd);
    saveBracket();render();return;
  }
  if(t.id==="saveres"){
    var f=fixtures(upMd),out=[],bad=0;
    f.forEach(function(m,i){
      var a=document.querySelector('[data-sc="'+i+'"][data-k="0"]').value,
          b=document.querySelector('[data-sc="'+i+'"][data-k="1"]').value;
      if(a===""||b==="")bad++; out.push([+a||0,+b||0]);
    });
    var msg=document.getElementById("savemsg");
    if(bad){msg.textContent=bad+" match"+(bad===1?"":"es")+" still blank — fill them all in first.";msg.style.color="var(--bad)";return}
    S.results["md"+upMd]={s:out,at:new Date().toISOString().slice(0,10)};
    saveResults(upMd).then(function(){msg.textContent="Saved.";msg.style.color="var(--good)";render()})
      .catch(function(){msg.textContent="Saved on this device only.";msg.style.color="var(--gold)";render()});
    return;
  }
  if(t.dataset.me!==undefined){MY=t.dataset.me||null;mySave();render();window.scrollTo(0,0);return}
  if(t.dataset.mymd){myMd=+t.dataset.mymd;render();return}
  if(t.dataset.cmp){cmpMd=+t.dataset.cmp;render();return}
  if(t.dataset.my!==undefined&&t.dataset.v){
    if(!isOpen(myMd))return;
    var k=myKey(myMd),ix=+t.dataset.my;
    if(!myPicks[k])myPicks[k]=new Array(18).fill(null);
    myPicks[k][ix]=(myPicks[k][ix]===t.dataset.v?null:t.dataset.v);
    mySave();render();return;
  }
  if(t.id==="mycopy"){
    var txt=myMessage(myMd),ok=false;
    try{var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);
        ta.select();ok=document.execCommand("copy");document.body.removeChild(ta)}catch(e){}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).catch(function(){});
    t.textContent=ok?"Copied":"Select the list and copy it";
    setTimeout(function(){t.textContent="Copy them"},2500);
    return;
  }
  if(t.id==="readcode"){
    var msg=document.getElementById("codemsg"),r=readCode(document.getElementById("jimcode").value);
    if(r.err){msg.textContent=r.err;msg.style.color="var(--bad)";return}
    if(!isOpen(r.md)){
      msg.textContent="Matchday "+r.md+" is already locked, so those picks cannot be used.";
      msg.style.color="var(--bad)";return;
    }
    if(!S.picks[r.who])S.picks[r.who]={};
    S.picks[r.who][r.md]=r.arr;
    savePicks(r.who);
    who=r.who;
    codeFlash={t:"Read Matchday "+r.md+" \u2014 all 18 of "+cap(r.who)+"\u2019s picks are in.",c:"var(--good)"};
    render();return;
  }
  if(t.id==="copyexp"){
    var box=document.getElementById("exportbox"),em=document.getElementById("expmsg");
    box.select();
    var ok=false; try{ok=document.execCommand("copy")}catch(e){}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(box.value).then(function(){em.textContent="Copied.";em.style.color="var(--good)"},function(){});}
    em.textContent=ok?"Copied.":"Selected — press Ctrl+C (or Cmd+C).";em.style.color=ok?"var(--good)":"var(--gold)";
    return;
  }
  if(t.id==="clearres"){delete S.results["md"+upMd];saveResults(upMd);render();return}
  if(t.id==="parsebtn"){
    var txt=document.getElementById("pastebox").value,f2=fixtures(upMd),got=0;
    var lines=txt.split("\n"),out2=f2.map(function(){return null});
    lines.forEach(function(ln){
      var m=ln.match(/^\s*(.+?)\s+(\d+)\s*[-–:]\s*(\d+)\s+(.+?)\s*$/)||ln.match(/^\s*(.+?)\s+(\d+)\s+(.+?)\s+(\d+)\s*$/);
      if(!m)return;
      var h1,g1,g2,a1;
      if(/[-–:]/.test(ln.replace(/^[^0-9]*/,"").slice(0,6))||ln.match(/\d+\s*[-–:]\s*\d+/)){h1=m[1];g1=+m[2];g2=+m[3];a1=m[4]}
      else{h1=m[1];g1=+m[2];a1=m[3];g2=+m[4]}
      var key=function(s){return s.toLowerCase().replace(/[^a-z]/g,"")};
      f2.forEach(function(fx,i){
        if(key(nm(fx.h)).indexOf(key(h1))>=0||key(h1).indexOf(key(nm(fx.h)))>=0){
          if(key(nm(fx.a)).indexOf(key(a1))>=0||key(a1).indexOf(key(nm(fx.a)))>=0){out2[i]=[g1,g2];got++}
        }
      });
    });
    var pm=document.getElementById("parsemsg");
    if(got===18){S.results["md"+upMd]={s:out2,at:new Date().toISOString().slice(0,10)};saveResults(upMd);render()}
    else{pm.textContent="Matched "+got+" of 18 lines. Check the team names.";pm.style.color="var(--gold)"}
    return;
  }
  if(t.id==="savebk"){
    ROUNDS.forEach(function(R){
      var raw=document.querySelector('[data-bkset="'+R.k+'"]').value;
      var ties=[],wins=[];
      raw.split("\n").forEach(function(ln){
        if(!ln.trim())return;
        var p=ln.split(/\s+v\.?s?\.?\s+/i); if(p.length<2)return;
        var A=p[0].trim(),B=p[1].trim(),w=null;
        if(/\*\s*$/.test(A)){w=0;A=A.replace(/\*\s*$/,"").trim()}
        if(/\*\s*$/.test(B)){w=1;B=B.replace(/\*\s*$/,"").trim()}
        ties.push([A,B]);wins.push(w);
      });
      S.bracket.setup[R.k]=ties.slice(0,R.c);
      S.bracket.winners[R.k]=wins.slice(0,R.c);
    });
    var bm=document.getElementById("bkmsg");
    saveBracket().then(function(){bm.textContent="Saved.";bm.style.color="var(--good)";render()})
      .catch(function(){bm.textContent="Saved on this device only.";bm.style.color="var(--gold)";render()});
    return;
  }
});

/* ---------- boot ---------- */
myLoad();
if(STATIC&&/picks/i.test(location.hash))tab="makepicks";
render();
if(!STATIC&&window.claude&&claude.use){
  claude.use("db").then(function(db){
    if(!db)return; DB=db;
    return Promise.all([
      db.collection("picks").doc("brien").get().catch(function(){return null}),
      db.collection("picks").doc("jim").get().catch(function(){return null}),
      db.collection("bracket").doc("state").get().catch(function(){return null})
    ].concat(MDS.map(function(md){return db.collection("results").doc("md"+md).get().catch(function(){return null})})))
    .then(function(r){
      if(r[0]&&r[0].md)S.picks.brien=r[0].md;
      if(r[1]&&r[1].md)S.picks.jim=r[1].md;
      if(r[2]&&r[2].setup)S.bracket=r[2];
      MDS.forEach(function(md,k){var d=r[3+k];if(d&&d.s&&d.s.length===18)S.results["md"+md]=d});
      render();
    });
  }).catch(function(){});
}
</script>
